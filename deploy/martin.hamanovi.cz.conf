# Apache vhost pro martin.hamanovi.cz
# Umístění: /etc/apache2/sites-available/martin.hamanovi.cz.conf
# Aktivace (jako root): a2ensite martin.hamanovi.cz.conf && apache2ctl configtest && systemctl reload apache2

<VirtualHost *:80>
    ServerName martin.hamanovi.cz
    DocumentRoot /var/www/martin

    <Directory /var/www/martin>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Skryté soubory (.git, .env…) nikdy neservírovat
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set X-Frame-Options "SAMEORIGIN"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/martin_error.log
    CustomLog ${APACHE_LOG_DIR}/martin_access.log combined
</VirtualHost>
